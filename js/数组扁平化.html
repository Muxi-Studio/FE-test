<script>
    let result = []
    function flatten(arr){
        for(let i = 0;i <=arr.length;i++){
            const items = arr[i];
            if(arr.isArr(items)) {
                result=result.concat(flatten(items))
            }else{
                result = result.push(items)
            }
        }return result;
    }
    console.log(result);
    
    
</script>
